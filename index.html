<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميهي - Mihi</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: #f8f9fa; color: #333; line-height: 1.6; padding-bottom: 50px; }
        
        /* Header */
        header { background: linear-gradient(135deg, #e63946, #d62828); color: white; text-align: center; padding: 50px 20px; border-bottom-left-radius: 40px; border-bottom-right-radius: 40px; }
        header h1 { font-size: 2.8rem; margin-bottom: 10px; }
        
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        
        /* Cards */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .card i { font-size: 3rem; margin-bottom: 15px; }
        .medical i { color: #e63946; } .cooking i { color: #f4a261; }
        
        /* WhatsApp Button */
        .cta-section { background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .whatsapp-btn { display: inline-flex; align-items: center; gap: 10px; background-color: #25D366; color: white; text-decoration: none; font-size: 1.4rem; font-weight: bold; padding: 15px 40px; border-radius: 50px; transition: 0.3s; }
        .whatsapp-btn:hover { background-color: #1eb857; transform: scale(1.05); }

        /* Cat Section */
        .cat-section { text-align: center; margin-top: 50px; padding: 20px; }
        .cat-icon { font-size: 80px; cursor: pointer; transition: transform 0.2s; display: inline-block; }
        .cat-icon:active { transform: scale(0.9); }
        #meow-msg { font-size: 2rem; color: #d63384; font-weight: bold; margin-top: 15px; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <header>
        <h1>ميهي (Mihi)</h1>
        <p>استشارات طبية أولية & طهي منزلي بلمسة ماهرة</p>
    </header>

    <div class="container">
        <div class="services-grid">
            <div class="card medical">
                <i class="fa-solid fa-user-nurse"></i>
                <h2>الإسعافات الأولية</h2>
                <p>تقديم استشارات وتوجيهات طبية أولية للحالات الطارئة.</p>
            </div>
            <div class="card cooking">
                <i class="fa-solid fa-utensils"></i>
                <h2>طاهية ماهرة</h2>
                <p>إعداد أشهى الأطباق المنزلية لحجوزاتكم ومناسباتكم الخاصة.</p>
            </div>
        </div>

        <div class="cta-section">
            <h3>للحجز أو الاستفسار</h3>
            <p>تواصل معنا مباشرة عبر الواتساب</p><br>
            <a href="https://wa.me/967739120300?text=أهلاً ميهي، أرغب في الاستفسار أو الحجز." target="_blank" class="whatsapp-btn">
                <i class="fa-brands fa-whatsapp"></i> مراسلة ميهي
            </a>
        </div>

        <!-- قسم القطة -->
        <div class="cat-section">
            <p>هل تريد مفاجأة؟</p>
            <div class="cat-icon" onclick="sayMeow()">🐱</div>
            <div id="meow-msg">ميااااو! 🐱</div>
        </div>
    </div>

    <script>
        function sayMeow() {
            const msg = document.getElementById('meow-msg');
            msg.style.opacity = '1';
            setTimeout(() => { msg.style.opacity = '0'; }, 1500);
        }
    </script>

</body>
</html>
